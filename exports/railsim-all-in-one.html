replaceAll(`{${C}}`,String(l[C]));return o}const jt=`  <h1>AF궤도회로 시뮬레이터</h1>
  <p class="sub">열차가 구간에 들어오면 궤도회로가 어떻게 ‘점유’를 감지하고 신호가 바뀌는지, 그리고 길게 나눈 30AT·30BT가 <b>중계궤도</b>로 어떻게 하나처럼 묶이는지 직접 확인해 보세요.</p>

  <section class="card">
    <div class="scroll"><svg id="track" viewBox="0 0 1000 260" role="img" aria-label="10T, 20T, 30AT, 30BT 구간과 중계 접점, 이동하는 열차"></svg></div>

      <button id="play" class="primary">▶ 운행 시작</button>
      <button id="reset">↺ 처음으로</button>

      <button id="btStop">30BT에 세우기</button>
      <label class="speed">속도 <input id="speed" type="range" min="0.5" max="3" step="0.5" value="1"></label>
      <span class="group">회로 구성</span>
      <button id="mode" class="mode" aria-pressed="true">🔗 중계 연결 켜짐</button>
      <span class="group">고장 넣어 보기</span>
      <button id="fRail" class="fault" aria-pressed="false">⚡ 20T 레일 고장</button>
      <button id="fBT" class="fault" aria-pressed="false">⚡ 30BT 송신 고장</button>
      <button id="fWire" class="fault" aria-pressed="false">⚡ 중계 배선 단선</button>
      <button id="fTPR" class="fault" aria-pressed="false">⚡ 30AT TPR 회로 단선</button>
    </div>

    <div class="grid" id="cards"></div>

  <h2>계전기실 · 연동 · 표시</h2>
  <section class="card">
    <div class="scroll"><svg id="room" viewBox="0 0 1000 300" role="img" aria-label="현장 TR이 계전기실 TPR, 연동논리부, 표시제어부와 광통신부를 거쳐 표시 화면으로 이어지는 흐름"></svg></div>
    <p class="meta" style="margin:8px 0 0">현장 TR이 붙어 있을 때만 B24V가 TR 접점을 지나 계전기실 TPR로 갑니다. 연동은 TPR 접점을 읽고 신호와 표시에 반영합니다.</p>
  </section>

  <h2>무슨 일이 일어나나요?</h2>
  <section class="card">
    <ol>
      <li><b>송신기(TX)</b>가 구간마다 정해진 주파수의 신호 전류를 레일에 흘립니다. 이웃 구간은 A형(1,699Hz)·B형(2,296Hz)을 번갈아 씁니다.</li>
      <li>구간 반대쪽 <b>수신기(RX)</b>가 그 신호를 받으면 “비어 있음(비점유)”으로 판단하고 <b>궤도계전기(TR)</b>가 여자됩니다.</li>
      <li>열차가 들어오면 <b>차축이 두 레일을 이어</b>(단락) 전류가 수신기까지 가지 못합니다.</li>
      <li>수신 레벨이 떨어지면 <b>TR이 낙하</b>하고 구간은 “점유”가 됩니다.</li>
      <li>TR의 상태는 계전기실의 <b>TPR</b>이 그대로 따라 하고, <b>연동</b>은 TPR 접점을 읽어 표시와 신호를 바꿉니다.</li>
      <li>점유 정보에 따라 <b>뒤쪽 신호기가 정지(적색)·주의(황색)</b>로 바뀌어 추돌을 막습니다.</li>
    </ol>
  </section>

  <h2>중계궤도는?</h2>
  <section class="two">
    <div class="card bulb">
      <p><b>전구 하나로 생각하면 됩니다.</b> 30AT 송신이 건전지, 30AT TR이 전구입니다. 전선 중간에 스위치 두 개가 한 줄로 달려 있습니다.</p>
      <p>① <b>30AT 레일</b> — 30AT에 열차가 오면 끊김<br>② <b>30BT 접점</b> — 30BT에 열차가 오면 끊김</p>
      <p style="margin:0">둘 중 하나만 끊겨도 전구가 꺼집니다. 그래서 <b>30AT는 30A·30B 어디가 점유돼도 낙하</b>합니다. 레일은 길어서 둘로 나눴지만, 30AT 하나만 보면 두 토막이 다 비었는지 알 수 있습니다.</p>
    </div>
    <div class="card bulb">
      <p><b>외울 것 세 줄</b></p>
      <ol>
        <li>30AT 송신선에 30BT 접점이 들어 있다.</li>
        <li>30A·30B 어디가 점유돼도 30AT가 떨어진다.</li>
        <li>30AT가 떨어져 있으면 30BT부터 본다.</li>
      </ol>
      <p class="def">국제 표준 IEC 60050-821(821-03-26) “cut section of track circuit”: 옆 궤도회로 계전기의 여자 접점을 통해 전원을 받는 궤도회로. 30BT 경계에는 신호기가 없습니다(미국 49 CFR §236.736: 신호기 위치가 아닌 곳의 궤도회로 경계).</p>
    </div>
  </section>

  <h2>고장이 나면?</h2>
  <section class="card">
    <p style="margin:0 0 10px">고장 버튼을 눌러 보세요. 어떤 고장이든 결과는 <b>점유·정지</b> 쪽입니다. 고장이 나도 안전한 쪽으로 동작하는 것을 <b>페일세이프(Fail-safe)</b>라고 합니다.</p>
    <details>
      <summary>30AT 점검값 보기 (예시값)</summary>
      <table>
        <thead><tr><th>측정 위치</th><th>값</th><th>기준</th></tr></thead>
        <tbody>
          <tr><td>30AT 송신 출력</td><td class="v" id="mTx"></td><td class="meta">6.8~13.2V</td></tr>
          <tr><td>30AT TU 입력 (4·5번)</td><td class="v" id="mTU"></td><td class="meta">기록값 대비</td></tr>
          <tr><td>30AT 수신 입력</td><td class="v" id="mRx"></td><td class="meta">15mA 이상</td></tr>
          <tr><td>30AT TR 전압</td><td class="v" id="mTR"></td><td class="meta">22.1~25.9V</td></tr>
          <tr><td>30AT TPR 코일 (B24V)</td><td class="v" id="mTPR"></td><td class="meta">DC 24V</td></tr>
        </tbody>
      </table>
      <p class="meta" style="margin:8px 0 0">30BT에 열차가 있을 때 TU 입력 0V는 정상입니다. 송신 출력은 정상인데 TU 입력이 없으면 30BT 접점이나 배선을 의심합니다.</p>
    </details>
  </section>

  <h2>용어</h2>
  <section class="card">
    <dl>
      <dt>AF</dt><dd>Audio Frequency, 사람이 들을 수 있는 대역의 주파수를 쓴다는 뜻</dd>
      <dt>궤도회로</dt><dd>레일을 전기회로로 이용해 열차 위치를 감지하는 장치</dd>
      <dt>점유 / 비점유</dt><dd>구간에 열차가 있음 / 없음</dd>
      <dt>단락(Shunt)</dt><dd>열차 바퀴와 차축이 두 레일을 전기적으로 이어 주는 것</dd>
      <dt>TR (궤도계전기)</dt><dd>현장에서 수신 결과에 따라 붙거나(여자) 떨어지는(낙하) 스위치</dd>
      <dt>TPR</dt><dd>계전기실에서 TR의 상태를 그대로 따라 하는 계전기. 연동은 TPR 접점을 읽는다</dd>
      <dt>중계궤도</dt><dd>옆 궤도(30BT) 계전기의 접점을 거쳐 송신하는 궤도(30AT). 두 구간을 하나처럼 묶는다</dd>
      <dt>연동논리부 (EI)</dt><dd>궤도·신호 조건을 따져 신호와 표시를 정하는 장치</dd>
      <dt>광통신부</dt><dd>연동의 정보를 광케이블로 다른 장치에 보내는 부분</dd>
    </dl>
  </section>

  <p class="note">교육용 개념 모형입니다. 주파수는 TI21형 공칭주파수, 기준값은 AF궤도회로 유지보수 매뉴얼(K746-4-B207) 값이며, 측정값과 신호 현시, 30AT·30BT 결선과 표시 화면은 이해를 돕기 위한 예시로 실제 노선 설비와 다를 수 있습니다.</p>

  <h2 class="why"><span class="step">1</span>궤도회로 하나는 길게 못 뽑는다</h2>
  <section class="card">
    <div class="scroll"><svg id="lenSvg" viewBox="0 0 1000 250" role="img" aria-label="구간 길이에 따라 수신 신호가 약해지는 그래프"></svg></div>

      <button class="mode ballast" data-b="mid" aria-pressed="false">보통</button>

    </div>
    <div class="status" id="lenStatus" aria-live="polite"></div>
    <p class="meta" style="margin:8px 0 0">레일에는 저항이 있고, 두 레일 사이 자갈을 통해 전류가 조금씩 샙니다. 그래서 멀어질수록 신호가 약해집니다. AF 한 구간은 보통 600~1,000m(매뉴얼)이고, 미국 자료는 약 1.2km 이하로 제한한다고 합니다. 곡선과 퍼센트는 이해를 돕기 위한 개념 모형입니다.</p>
  </section>

  <h2 class="why"><span class="step">2</span>신호기 간격은 궤도회로 길이와 따로 정해진다</h2>
  <section class="card">
    <div class="scroll"><svg id="blkSvg" viewBox="0 0 1000 270" role="img" aria-label="1,800m 폐색구간을 궤도회로 하나로 덮지 못해 30AT와 30BT로 나누는 그림"></svg></div>
    <p style="margin:10px 0 0">신호기와 신호기 사이(폐색구간)의 길이는 열차가 멈추는 데 필요한 거리 같은 운전 조건으로 정해집니다. 그래서 폐색구간이 궤도회로 하나보다 길어질 수 있습니다. 레일은 둘로 나눠야 하는데, <b>나눈 지점에는 신호기가 없습니다.</b></p>
    <p class="def">미국 49 CFR §236.736 Cut-section: 폐색구간 안에서, 신호기 위치가 아닌 곳에 두 궤도회로의 경계가 있는 지점.</p>
  </section>

  <h2 class="why"><span class="step">3</span>나눈 두 궤도를 하나로 묶는 것이 중계</h2>
  <section class="two">
    <div class="card">
      <h3 style="margin:0 0 6px;font-size:1rem">중계 없이 나누기만 하면</h3>
      <svg id="cmpA" viewBox="0 0 480 290" role="img" aria-label="중계 없이 연동이 30AT와 30BT를 따로 읽는 그림"></svg>
      <div class="count">2<small>연동이 확인할 궤도 조건</small></div>
      <p class="meta" style="margin:4px 0 0">30BT 상태를 신호기 쪽으로 따로 전해야 합니다.</p>
    </div>
    <div class="card" style="border-color:var(--relay)">
      <h3 style="margin:0 0 6px;font-size:1rem">중계로 묶으면</h3>
      <svg id="cmpB" viewBox="0 0 480 290" role="img" aria-label="30BT 접점이 30AT 송신을 끊어 30AT 하나로 두 구간을 대표하는 그림"></svg>
      <div class="count" style="color:var(--relay)">1<small>30AT 하나만 보면 됨</small></div>
      <p class="meta" style="margin:4px 0 0">30BT 상태가 접점을 통해 30AT로 넘어옵니다.</p>
    </div>
  </section>
  <section class="card" style="margin-top:10px">
    <ul class="benefits">
      <li><span class="tag src">근거</span><b>30AT 하나로 30A·30B 전체를 판단합니다.</b> 계전기 접점 논리로 둘 이상의 cut section을 하나의 신호 블록으로 합칩니다(미국 궤도검지 자료).</li>
      <li><span class="tag src">근거</span><b>표준 정의와 같습니다.</b> IEC 60050-821(821-03-26): 옆 궤도회로 계전기의 여자 접점을 통해 전원을 받는 궤도회로.</li>
      <li><span class="tag int">해석</span><b>30BT 상태를 따로 보낼 회로가 줄어듭니다.</b> 궤도회로 자체가 상태를 넘겨주므로, 연동이 볼 조건도 하나로 줄어듭니다.</li>
      <li><span class="tag int">해석</span><b>고장도 안전한 쪽입니다.</b> 30BT 쪽 어디가 고장 나도 접점이 열려 30AT까지 낙하하므로 결과는 정지입니다.</li>
    </ul>
  </section>

  <h2 class="why"><span class="step">4</span>한계: 한 방향 선로에 맞다</h2>
  <section class="card">
    <div class="scroll"><svg id="dirSvg" viewBox="0 0 1000 120" role="img" aria-label="열차 진행 방향이 한쪽으로 정해진 구조"></svg></div>
    <p style="margin:8px 0 0">30BT가 30AT의 송신을 끊는 방향이 정해져 있고, 30AT 입구 신호기 하나가 두 구간을 지킵니다. 그래서 이 방식은 열차가 한 방향으로만 다니는 선로에 맞습니다(영문 위키백과). 양방향 운행 구간은 현장 설계를 확인해야 합니다.</p>
  </section>

  <p class="sub">AF궤도회로는 선로마다 주파수 한 쌍을 정해 두고, 구간마다 번갈아 씁니다. 이웃 구간 사이 20m 동조구간에서 튜닝유니트가 두 주파수를 갈라 줍니다. 구간을 눌러 자세히 보세요.</p>

  <section class="card">
    <div class="controls" style="margin-top:0">
      <button class="mode lay" data-lay="2" aria-pressed="true">복선 (상선·하선)</button>
      <button class="mode lay" data-lay="4" aria-pressed="false">복복선 (4선)</button>
      <button id="waveBtn" aria-pressed="true">〰 주파수 흐름 켜짐</button>
    </div>
    <div class="scroll" style="margin-top:10px"><svg id="lineSvg" viewBox="0 0 1000 260" role="img" aria-label="선로별 궤도회로 구간과 공칭주파수, 튜닝유니트, 동조구간 배치"></svg></div>
    <div class="chips" id="chips"></div>
    <div class="info" id="info" aria-live="polite"></div>
    <p class="meta" style="margin:10px 0 0">동조구간(20m)은 잘 보이도록 실제보다 넓게 그렸습니다. 구간 길이는 600~1,000m 안에서 고른 예시이고, 흐르는 물결은 주파수를 눈으로 보이게 한 표현입니다(주파수가 높을수록 촘촘하고 빠르게).</p>
  </section>

  <h2>동조구간 확대 — 공진으로 두 주파수가 갈리는 20m</h2>
  <section class="card">
    <div class="scroll"><svg id="zoomSvg" viewBox="0 0 1000 330" role="img" aria-label="튜닝유니트의 공진 곡선과, 동조구간에서 A 주파수와 B 주파수가 서로 막혀 사라지는 그림"></svg></div>
    <p style="margin:8px 0 0">튜닝유니트는 <b>공진</b>을 이용합니다. 라디오가 채널을 맞추면 그 방송만 또렷해지듯, 튜닝유니트는 자기 구간 주파수에서 가장 크게 반응하고(위 곡선의 봉우리), 다른 주파수에는 거의 반응하지 않습니다.</p>
    <p style="margin:8px 0 0">그래서 A 신호는 동조구간을 지나며 약해지다가 B쪽 튜닝유니트 앞에서 막히고, B 신호도 A쪽 튜닝유니트 앞에서 막힙니다. 두 튜닝유니트 사이 <b>20m(±0.5m)</b>가 동조구간(전기적 분리 이음매)이고, 레일을 자르지 않고도 구간이 나뉘는 이유입니다.</p>
    <p class="meta" style="margin:8px 0 0">공진 곡선의 모양과 물결이 줄어드는 모습은 원리를 보여 주기 위한 개념 표현입니다. 실제 튜닝유니트의 내부 회로와 특성값은 제조사 자료를 따릅니다.</p>
  </section>

  <h2>설명</h2>
  <section class="two">
    <div class="card">
      <h3 style="margin:0 0 8px;font-size:1rem">공칭주파수 8종 (TI21형)</h3>
      <table>
        <thead><tr><th>선로</th><th>유형</th><th>공칭주파수</th></tr></thead>
        <tbody>
          <tr><td>하선 →</td><td>A · B</td><td class="v">1,699 · 2,296 Hz</td></tr>
          <tr><td>상선 ←</td><td>C · D</td><td class="v">1,996 · 2,593 Hz</td></tr>
          <tr><td>복복선 추가 →</td><td>E · F</td><td class="v">1,549 · 2,146 Hz</td></tr>
          <tr><td>복복선 추가 ←</td><td>G · H</td><td class="v">1,848 · 2,445 Hz</td></tr>
        </tbody>
      </table>
      <p class="meta" style="margin:8px 0 0">8종 모두 1,549~2,593Hz 안에 있습니다. 화살표 방향은 매뉴얼 주파수 분할도를 따랐습니다.</p>
    </div>
    <div class="card">
      <h3 style="margin:0 0 8px;font-size:1rem">왜 이렇게 배치하나요?</h3>
      <ul class="benefits">
        <li><b>이웃 구간은 다른 주파수</b> — A → B → A → B처럼 번갈아 쓰면 붙어 있는 두 구간이 섞이지 않습니다. 수신기는 라디오 채널처럼 자기 주파수만 듣습니다.</li>
        <li><b>선로마다 다른 쌍</b> — 하선은 A·B, 상선은 C·D를 써서 나란히 놓인 선로끼리도 같은 주파수가 겹치지 않습니다. 복복선은 E·F, G·H까지 씁니다.</li>
      </ul>
    </div>
    <div class="card">
      <h3 style="margin:0 0 8px;font-size:1rem">튜닝유니트</h3>
      <ul class="benefits">
        <li>공진을 이용해 자기 주파수만 통과시키고, 구간을 전기적으로 나누는 이음매 역할을 합니다.</li>
        <li>한 구간에 2대. 이웃 구간과 맞닿는 곳은 <b>일반형</b>, 구간이 끝나는 곳은 <b>종단형</b>을 씁니다.</li>
        <li>단자: <b>1·2</b> 수신, <b>3</b> 접지, <b>4·5</b> 송신, <b>T1·T2</b> 레일.</li>
      </ul>
    </div>
    <div class="card">
      <h3 style="margin:0 0 8px;font-size:1rem">구간 길이</h3>
      <ul class="benefits">
        <li>매뉴얼 구성도 기준 한 구간 <b>600~1,000m</b>, 이웃 구간과는 <b>20m</b> 동조구간.</li>
        <li>정상 전력방식 <b>200~1,100m</b>, 짧은 구간용 저전력 방식 <b>50~250m</b>.</li>
        <li>이보다 긴 구간은 나눠야 하고, 나눈 두 궤도를 묶을 때 중계궤도를 씁니다(② 페이지).</li>
      </ul>
    </div>

  <p class="sub">한 줄 요약: <b>레일에는 신호전류와 귀선전류가 함께 흐릅니다. 임피던스본드는 두 전류를 ‘방향’으로 구별해서, 귀선전류는 통과시키고 신호전류는 구간 안에 가둡니다.</b> 이 페이지의 주인공은 소형인 <b>B2</b>입니다.</p>

  <h2 class="why"><span class="step">1</span>레일 하나에 전류가 두 종류 흐른다</h2>
  <section class="two">
    <div class="card bulb" style="border-color:var(--flow)">
      <p><b style="color:var(--flow)">신호전류 (AF)</b></p>
      <p>송신기가 레일에 흘리는 <b>1,549~2,593Hz</b> 대역의 신호입니다. 두 레일에서 <b>서로 반대 방향</b>으로 오가며 열차를 찾습니다.</p>
      <p style="margin:0"><b>구간 밖으로 새면</b> 이웃 구간 신호와 섞이므로, 구간 안에 가둬야 합니다.</p>
    </div>
    <div class="card bulb" style="border-color:var(--relay)">
      <p><b style="color:var(--relay)">귀선전류</b></p>
      <p>전차선에서 열차로 들어간 전류가 <b>레일을 타고 변전소로 돌아가는</b> 전류입니다. 두 레일에 <b>같은 방향</b>으로 흐릅니다.</p>
      <p style="margin:0"><b>막으면 안 되고</b>, 끊김 없이 돌려보내야 합니다.</p>
    </div>
  </section>
  <section class="card" style="margin-top:10px">
    <ul class="benefits">
      <li><span class="tag src">근거</span><b>귀선전류는 통과, 신호전류는 차단.</b> 임피던스본드는 귀선전류를 통과시키고 신호전류는 막아 자기 구간 밖으로 새지 않게 합니다. 크기에 따라 B1(대형)·B2(소형)로 나뉩니다.</li>
      <li><span class="tag int">해석</span><b>같은 레일의 두 전류를 무엇으로 구별할까요?</b> 전류의 <b>방향</b>입니다. 두 레일에서 반대 방향이면 신호, 같은 방향이면 귀선입니다. 아래에서 직접 확인해 보세요.</li>
    </ul>
  </section>

  <h2 class="why"><span class="step">2</span>본드가 길을 갈라 준다</h2>
  <section class="card">
    <div class="scroll"><svg id="bondSvg" viewBox="0 0 1000 340" role="img" aria-label="두 레일에 걸쳐 달린 임피던스본드. 귀선전류는 중성점으로 빠져나가고 신호전류는 막히는 개념도"></svg></div>
    <div class="controls">
      <span class="group">흐르는 전류</span>
      <button class="mode bmode" data-m="ret" aria-pressed="false">귀선전류만</button>
      <button class="mode bmode" data-m="sig" aria-pressed="false">신호전류만</button>
      <button class="mode bmode" data-m="both" aria-pressed="true">둘 다</button>
      <span class="group">본드 크기 비교</span>
      <button class="mode bsize" data-s="B2" aria-pressed="true">B2 (소형)</button>
      <button class="mode bsize" data-s="B1" aria-pressed="false">B1 (대형)</button>
      <span class="group">고장 넣어 보기</span>
      <button id="bFault" class="fault" aria-pressed="false">⚡ 중성점 접속 풀림 (예시)</button>
    </div>
    <div class="status" id="bondStatus" aria-live="polite"></div>
    <div class="info" id="bondInfo"></div>
    <p class="meta" style="margin:10px 0 0">두 레일 사이를 실제보다 넓게 그린 개념도입니다. 본드를 어디에 어떻게 접속하는지는 설비마다 다르므로 구성도를 따르세요. B1·B2는 크기만 다르게 그렸습니다.</p>
  </section>

  <h2 class="why"><span class="step">3</span>왜 귀선은 통과하고 신호는 막힐까</h2>
  <section class="two">
    <div class="card bulb">
      <p><b>본드는 가운데에 중성점이 있는 코일입니다.</b> 코일의 위쪽 반과 아래쪽 반이 철심 하나를 함께 감고 있고, 위·아래 끝은 각각 한쪽 레일에 이어집니다.</p>
      <p style="margin:0">전류는 코일 감긴 방향대로 철심에 자속(자기장)을 만듭니다. 위 반과 아래 반의 자속이 <b>서로 같은 방향이면 합쳐지고, 반대 방향이면 상쇄</b>됩니다.</p>
    </div>
    <div class="card bulb">
      <p><b style="color:var(--relay)">귀선전류</b> — 양 끝으로 들어와 <b>가운데로 모입니다.</b> 위 반과 아래 반의 자속이 서로 반대여서 <b>상쇄</b>되고, 코일이 거의 없는 것처럼 지나갑니다. → 임피던스 <b>낮음</b></p>
      <p style="margin:0"><b style="color:var(--flow)">신호전류</b> — 한쪽 끝으로 들어와 <b>반대쪽 끝으로 나가려</b> 합니다. 두 반의 자속이 <b>합쳐져</b> 코일이 강하게 버팁니다. → 임피던스 <b>높음</b></p>
    </div>
  </section>
  <p class="def" style="margin-top:10px">위 설명은 일반적인 전기 원리로 풀어 쓴 개념 설명입니다(해석). 그림의 자속 화살표는 합쳐지는지 상쇄되는지를 보여 주려고 그린 표현입니다.</p>

  <h2 class="why"><span class="step">4</span>주파수가 높을수록 신호는 더 막힌다</h2>
  <section class="card">
    <div class="scroll"><svg id="bzSvg" viewBox="0 0 1000 290" role="img" aria-label="주파수에 따라 달라지는 신호 방향 임피던스와 귀선 방향 임피던스의 개념 곡선"></svg></div>
    <div class="controls">
      <label class="ctrl">주파수 <input id="bzF" type="range" min="0" max="3000" step="10" value="1699"> <b id="bzFv">1,699 Hz</b></label>
      <button class="bzp" data-f="60">전철 전원 (60Hz)</button>
      <button class="bzp" data-f="1699">A 1,699Hz</button>
      <button class="bzp" data-f="2296">B 2,296Hz</button>
    </div>
    <div class="status" id="bzStatus" aria-live="polite"></div>
    <p class="meta" style="margin:8px 0 0">곡선은 ‘주파수가 높을수록 코일이 더 강하게 막는다’는 경향을 보여 주는 개념 곡선이며 실제 임피던스 값이 아닙니다. 60Hz는 예시이고 선로의 전원 방식에 따라 다릅니다.</p>
  </section>

  <h2 class="why"><span class="step">5</span>B1과 B2</h2>
  <section class="two">
    <div class="card">
      <table>
        <thead><tr><th>구분</th><th>크기</th><th>역할</th></tr></thead>
        <tbody>
          <tr><td><b>B1</b></td><td class="v">대형</td><td class="meta">귀선전류 통과 · 신호전류 차단</td></tr>
          <tr><td><b style="color:var(--relay)">B2</b></td><td class="v">소형</td><td class="meta">귀선전류 통과 · 신호전류 차단</td></tr>
        </tbody>
      </table>
      <p class="meta" style="margin:8px 0 0"><span class="tag src">근거</span>B1은 대형, B2는 소형입니다(매뉴얼 정리). 역할은 같고 크기가 다릅니다.</p>
    </div>
    <div class="card bulb">
      <p><b>이 앱에 담지 않은 것</b></p>
      <p style="margin:0">B1·B2 각각의 정격 전류, 임피던스 값, 어느 설비에 어느 것을 쓰는지는 확인된 자료가 없어 넣지 않았습니다. 설비 구성도와 유지보수 매뉴얼(K746-4-B207)을 확인하세요.</p>
    </div>
  </section>

  <h2 class="why"><span class="step">6</span>점검할 때 보는 곳</h2>
  <section class="card">
    <ul class="benefits">
      <li><span class="tag src">근거</span><b>임피던스본드 단자</b>가 풀리지 않았는지, 흙·자갈이 쓸려 넘어질 우려는 없는지 봅니다.</li>
      <li><span class="tag src">근거</span><b>임피던스본드~레일 접속부</b>와 <b>튜닝유니트~레일 접속부</b>는 바깥에 노출되어 취약하니 확인합니다.</li>
      <li><span class="tag src">근거</span><b>본드선·잠바선</b>이 빠지거나 풀리지 않았는지 봅니다.</li>
      <li><span class="tag int">해석</span>위 ‘중성점 접속 풀림’처럼 접속이 풀리면 귀선전류가 갈 낮은 임피던스 길이 사라질 수 있습니다. 단자 체결을 보는 이유입니다.</li>
    </ul>
    <p style="margin:10px 0 0"><a class="btnlink" href="#/m/af-track-circuit">① 시뮬레이터로 돌아가기 →</a></p>
  </section>

  <h2>용어</h2>
  <section class="card">
    <dl>
      <dt>임피던스</dt><dd>교류에 대한 저항. 주파수에 따라 달라진다</dd>
      <dt>임피던스본드</dt><dd>두 레일에 걸쳐 달아 귀선전류는 통과시키고 신호전류는 막는 코일 장치</dd>
      <dt>귀선전류</dt><dd>열차를 거쳐 레일을 타고 변전소로 돌아가는 전류</dd>
      <dt>중성점</dt><dd>코일의 한가운데에서 뽑은 단자. 귀선전류가 모여 빠져나가는 곳</dd>
      <dt>자속</dt><dd>철심 안을 지나는 자기장의 흐름. 같은 방향이면 합쳐지고 반대면 상쇄된다</dd>
    </dl>
  </section>

    <p class="meta" style="margin:12px 0 0">운행 중 지금 일어나고 있는 단계에 불이 들어옵니다. 앞 세 칸은 열차가 선로 위에 있는 한 항상 켜져 있습니다.</p>
  </section>

  <h2>다섯 페이지 정리</h2>
  <section class="card">
    <ul class="recap">
      <li><a href="#/m/af-track-circuit"><b>① 궤도회로</b><span>차축이 레일을 단락하면 수신이 끊겨 ‘점유’. 고장도 점유 쪽 — 페일세이프.</span><span class="go">다시 보기 →</span></a></li>
      <li><a href="#/m/af-track-circuit/2"><b>② 중계궤도</b><span>길어서 둘로 나눈 궤도를 계전기 접점으로 다시 하나로 묶는다.</span><span class="go">다시 보기 →</span></a></li>
      <li><a href="#/m/af-track-circuit/3"><b>③ 주파수 배치</b><span>이웃 구간은 다른 주파수, 경계는 20m 동조구간에서 공진으로 갈라진다.</span><span class="go">다시 보기 →</span></a></li>
      <li><a href="#/m/af-track-circuit/4"><b>④ 임피던스본드</b><span>귀선전류는 통과시키고 신호전류는 막아, 신호를 구간 안에 가둔다.</span><span class="go">다시 보기 →</span></a></li>
      <li><a href="#/m/af-track-circuit/5"><b>⑤ 폐색 (이 페이지)</b><span>한 구간에 열차 하나. 점유를 찾고, 신호로 뒤 열차를 세운다.</span><span class="go">지금 보고 있어요</span></a></li>
    </ul>
  </section>

  <h2>발표에서 이렇게 말하면 됩니다</h2>
  <section class="card">
    <p class="say">“폐색은 선로를 구간으로 나눠 한 구간에 열차 하나만 들이는 약속입니다. 궤도회로가 열차를 찾고, 중계·주파수·임피던스본드가 그 판단을 믿을 수 있게 만들고, 신호기가 뒤 열차를 세웁니다. 고장이 나면 정지 쪽으로 — 그래서 안전합니다.”</p>
  </section>
